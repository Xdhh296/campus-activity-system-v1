<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>用户注册</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f0f2f5;
            font-family: "微软雅黑", sans-serif;
        }
        .register-box {
            width: 420px;
            padding: 40px;
            background: white;
            border-radius: 8px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.1);
        }
        .register-box h2 {
            text-align: center;
            margin-bottom: 30px;
            color: #333;
        }
        .form-item {
            margin-bottom: 18px;
        }
        .form-item label {
            display: block;
            margin-bottom: 8px;
            color: #666;
        }
        .form-item input, .form-item select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 14px;
        }
        .btn {
            width: 100%;
            padding: 12px;
            background: #52c41a;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
        }
        .btn:hover {
            background: #73d13d;
        }
        .msg {
            color: #ff4d4f;
            text-align: center;
            margin-bottom: 15px;
            font-size: 14px;
        }
        .link {
            text-align: center;
            margin-top: 20px;
            font-size: 14px;
        }
        .link a {
            color: #1890ff;
            text-decoration: none;
        }
    </style>
</head>
<body>
<div class="register-box">
    <h2>用户注册</h2>
    <div class="msg" th:if="${msg}" th:text="${msg}"></div>
    <form th:action="@{/register}" method="post">
        <div class="form-item">
            <label>账号</label>
            <input type="text" name="username" required placeholder="请输入账号">
        </div>
        <div class="form-item">
            <label>密码</label>
            <input type="password" name="password" required placeholder="请输入密码">
        </div>
        <div class="form-item">
            <label>姓名</label>
            <input type="text" name="name" required placeholder="请输入真实姓名">
        </div>
        <div class="form-item">
            <label>身份</label>
            <select name="role">
                <option value="student">学生</option>
                <option value="teacher">教师</option>
            </select>
        </div>
        <button type="submit" class="btn">注册</button>
    </form>
    <div class="link">
        已有账号？<a th:href="@{/login}">返回登录</a>
    </div>
</div>
</body>
</html>
