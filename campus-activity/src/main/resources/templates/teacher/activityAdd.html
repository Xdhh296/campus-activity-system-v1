<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>发布活动</title>
</head>
<body>
<h3>发布活动</h3>
<form th:action="@{/teacher/activity/save}" method="post">

    <button type="submit">发布</button>
</form>
<br><a href="/teacher/dashboard">返回</a>
</body>
</html>
